<!DOCTYPE html>
<html>
<head>
    <title>JS Audio Syntax Test</title>
    <style>
        body { font-family: monospace; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>Audio Syntax Test Results</h1>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        
        function assert(condition, message) {
            const el = document.createElement('div');
            if (condition) {
                el.className = 'pass';
                el.textContent = 'PASS: ' + message;
            } else {
                el.className = 'fail';
                el.textContent = 'FAIL: ' + message;
                console.error('FAIL: ' + message);
            }
            resultsDiv.appendChild(el);
        }
        
        // Catch global errors (like SyntaxError from classic scripts)
        window.addEventListener('error', function(e) {
            if (e.message.includes('Unexpected token')) {
                assert(false, "SyntaxError thrown: " + e.message);
            }
        });
    </script>

    <!-- Load audio.js which previously had 'export' syntax error in classic mode -->
    <script src="../web/static/js/audio.js" onload="assert(typeof _resumeAndPlay === 'function', 'audio.js loaded without SyntaxError and _resumeAndPlay is defined')"></script>

</body>
</html>
