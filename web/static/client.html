<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LunaWave — Dengar Saja Mode">
    <meta name="theme-color" content="#090A0D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LunaWave — Dengar Saja</title>
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <link rel="stylesheet" href="/static/css/vendor/tabler-icons.min.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base/reset.css">
    <link rel="stylesheet" href="/static/css/base/typography.css">
    <link rel="stylesheet" href="/static/css/base/animations.css">
    <link rel="stylesheet" href="/static/css/layout/app-shell.css">
    <link rel="stylesheet" href="/static/css/layout/grid.css">
    <link rel="stylesheet" href="/static/css/components/player-bar.css">
    <link rel="stylesheet" href="/static/css/components/lyrics.css">

    <!-- Platform Overrides -->
    <link rel="stylesheet" href="/static/css/platform/mobile.css">
    <link rel="stylesheet" href="/static/css/platform/tablet.css">
    <link rel="stylesheet" href="/static/css/platform/desktop.css">
    <link rel="stylesheet" href="/static/css/platform/landscape.css">
    <link rel="stylesheet" href="/static/css/platform/safe-area.css">

    <style>
        .client-status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .client-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .client-footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: var(--text-3);
            z-index: 100;
        }
        .client-pbar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .client-pbar .pb-time {
            font-size: 11px;
            color: var(--text-3);
            font-family: var(--font-mono, monospace);
            min-width: 35px;
        }
        .client-pbar .pb-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
        }
        .client-pbar .pb-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: var(--text-1);
            border-radius: 2px;
        }
        .client-audio-cta {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 999px;
            border: none;
            background: var(--accent, #1db954);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
            cursor: pointer;
        }

        /* Push the cover art and content down slightly in client mode for better balance */
        body.client-mode .home-left-col {
            margin-top: 10vh !important;
        }
        @media (max-width: 600px) {
            body.client-mode .home-left-col {
                margin-top: 15vh !important;
            }
            /* Force lyrics to show on mobile to bypass any cached mobile.css */
            body.client-mode #tab-home .lyrics-wrap {
                display: flex !important;
            }
        }
    </style>
</head>
<body class="client-mode" data-active-tab="home" data-queue-empty="true" data-player-state="IDLE" data-has-lyrics="false">

    <button type="button" id="client-audio-cta" class="client-audio-cta">
        <i class="ti ti-volume-2"></i> Tap untuk mulai dengar
    </button>

    <div id="app" class="fm" style="display:flex; opacity:1;">

        <div class="client-status-bar">
            <div class="client-badge">
                <i class="ti ti-headphones"></i> Mode dengar saja
            </div>
            <div class="client-badge" id="client-ws-status" style="color: var(--red);">
                <i class="ti ti-wifi-off"></i> Offline
            </div>
        </div>

        <main class="content" id="content-area" style="padding-bottom: 120px; overflow-y: auto;">
            <section id="tab-home" class="tab-panel full-player-view active" style="display:flex; flex-direction:column; opacity:1; min-height: 100%;">

                <!-- Hidden DOM for renderNowPlaying() -->
                <div id="np-thumbnail" style="display:none;">
                    <i id="np-thumb-icon"></i>
                    <div id="np-eq-anim"><span></span><span></span><span></span></div>
                </div>
                <div id="np-dur-meta" style="display:none;"></div>

                <div class="home-left-col" style="margin: 0 auto;">
                    <div class="home-idle-view" id="home-idle-view">
                        <div class="idle-text-slider">
                            <span class="idle-text-slide">Menunggu musik dimainkan dari Admin...</span>
                        </div>
                    </div>

                    <div class="home-art-section" id="vinyl-wrap">
                        <div class="home-art-frame" id="vinyl-record">
                            <img id="vinyl-cover" src="" crossorigin="anonymous" alt="Album Art"
                                style="display:none; width:100%; height:100%; object-fit:cover; border-radius:inherit;">
                            <i id="vinyl-icon" class="ti ti-music-note home-art-placeholder"></i>
                        </div>
                    </div>

                    <div class="home-track-row">
                        <div class="home-track-info main-track-info" style="text-align: center; max-width: 100%; padding-right: 0;">
                            <div class="mti-title" id="np-title">Belum ada lagu</div>
                            <div class="mti-artist" id="np-artist">Putar lagu dari perangkat Admin</div>
                        </div>
                    </div>

                    <div class="lyrics-wrap" id="lyrics-wrap">
                        <div id="lyrics-text-container">
                            <div class="lyrics-line prev" id="lyrics-prev"></div>
                            <div class="lyrics-line current" id="lyrics-current"></div>
                            <div class="lyrics-line next" id="lyrics-next"></div>
                        </div>
                        <div class="home-equalizer" id="home-equalizer" style="display:none;">
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="client-pbar">
            <span class="pb-time" id="pb-time-pos">0:00</span>
            <div class="pb-track" id="pb-progress-track">
                <div class="pb-fill" id="pb-progress-fill" style="width: 0%"></div>
            </div>
            <span class="pb-time" style="text-align:right" id="pb-time-dur">0:00</span>
        </div>

        <div class="client-footer">
            Diputar dari perangkat Admin
        </div>

    </div>

    <!-- Hidden sheet so lyric renderer doesn't crash if it tries to modify it -->
    <div id="lyrics-sheet" style="display:none;">
        <div id="lyrics-content"></div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/utils/format.js"></script>
    <script src="/static/js/utils/toast.js"></script>
    <script src="/static/js/store.js"></script>
    <script src="/static/js/dom.js"></script>
    <script src="/static/js/render/now-playing.js"></script>
    <script src="/static/js/render/lyrics.js"></script>
    <script src="/static/js/audio/playback-sync.js"></script>
    <script src="/static/js/client.js"></script>
</body>
</html>
