# task_breakdown.agent.yaml
# REVISI v2 — 2026-07-19
# Fase A (quick_search_discover) sudah DONE dan dihapus dari file ini.
# File ini sekarang murni Fitur B: Redesain Login. Dibanding versi sebelumnya,
# T-B1..T-B19 dipecah jadi task lebih kecil (task-per-langkah, bukan
# task-per-file) supaya tiap commit lebih atomik dan lebih gampang di-rollback.
#
# STATUS: final — semua keputusan desain (blok `decisions`) sudah ditetapkan.
# Satu-satunya persetujuan manusia yang masih diperlukan: izin file
# governance-locked (aturan 2) dan konfirmasi Tahap B4 final (aturan 3).
#
# ATURAN EKSEKUSI UNTUK AGENT:
# 1. Ikuti `execution_order` di akhir file secara sekuensial per sesi. Task
#    dalam satu `session` dengan `parallel_ok: true` BOLEH dikerjakan/di-commit
#    tidak berurutan relatif satu sama lain (asal depends_on masing-masing
#    sudah terpenuhi) — tapi tetap tidak boleh melompati sesi.
# 2. Jangan eksekusi task dengan `locked: true` tanpa berhenti dan meminta
#    konfirmasi eksplisit dari user PERSIS sebelum task itu, walau task lain
#    dengan file yang sama sudah pernah disetujui sebelumnya di sesi lain.
# 3. Task dengan `risk: high` (T-B13.x/T-B14.x/T-B15.x) butuh konfirmasi
#    tambahan bahwa Tahap B4 (T-B9.1..T-B12.2, sesi 5-6) sudah dianggap final
#    oleh pemilik project sebelum jalan.
# 4. Setelah tiap task: jalankan `post_commands`, cek `dod` semua true, lalu
#    prepend entry `docs/PATCHLOG.md` (ID: PATCH-YYYY-MM-DD-NNN) kecuali task
#    punya `patchlog: skip`. Task bertanda `patchlog_group` ditulis SATU entry
#    gabungan untuk seluruh anggota grup tsb (lihat catatan tiap sesi).
# 5. Field `files` dengan prefix `LOCKED:` = governance-locked, tidak boleh
#    disentuh sebelum syarat aturan 2 terpenuhi.
# 6. Sesi dengan `parallel_ok: false` ("dedicated") wajib dikerjakan sendirian
#    tanpa task lain disisipkan di sesi yang sama — lihat rasional per sesi.
# 7. Task yang punya field `bundle_cmd`: setelah PATCHLOG di-prepend, jalankan
#    perintah itu di root repo. Hasilnya zip snapshot full repo (termasuk
#    docs/PATCHLOG.md terbaru) dinamai per task terakhir yang selesai — untuk
#    di-upload ke sesi Claude baru kalau sesi sekarang kena limit.

meta:
  source_features: ["login_redesign"]
  completed_features:
    - name: quick_search_discover
      status: done
      note: >
        Fase A sudah selesai dan diverifikasi (T-A1..T-A9). Tidak lagi
        dimuat di file ini. Jika perlu diagnosa ulang, lihat riwayat
        PATCHLOG dan versi lama file ini di git history.
  locked_files_global:
    - server/handlers/websocket.py
    - web/static/index.html
    - engine/playback/controller.py   # tidak relevan ke Fitur B, jangan disentuh
    - cache/admin_password.txt        # jangan pernah commit
  conventions:
    patchlog_id_format: "PATCH-YYYY-MM-DD-NNN"
    generated_block_markers: ["<!-- BEGIN:GENERATED -->", "<!-- END:GENERATED -->"]
    generated_block_rule: "jangan edit manual di antara marker, jangan hapus marker"
    ai_agent_flag_required_on: [doctor.py, verify_docs.py, architecture_lint.py, verify_structure.py, verify_security.py, find_owner.py, patchlog.py]
    ai_agent_flag: "--json"
    bundle_cmd_template: >
      zip -rq lunawave-{TASK_ID}.zip . -x ".git/*" -x "*__pycache__*"
      -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*"
      -x "*.DS_Store" -x "lunawave-T-*.zip"
    bundle_cmd_note: >
      Jalankan dari root repo. {TASK_ID} sudah disubstitusi jadi command
      literal di field `bundle_cmd` tiap task checkpoint di bawah — tinggal
      copy-paste, tidak perlu isi manual.

decisions:
  K3:
    question: "Strategi migrasi kredensial lama saat cut-over login"
    chosen: "tidak_migrasi_wajib_resetup"
    rationale: "Dua file password (cache/admin_password.txt, instance/admin_password.txt) tidak sinkron di lapangan; migrasi otomatis harus menebak sumber benar, risiko salah pilih lebih besar dari biaya re-setup sekali."
    status: resolved
  K4:
    question: "Nasib env var override LUNAWAVE_ADMIN_PASS / YTGUI_ADMIN_PASS"
    chosen: "dipertahankan_sebagai_override_eksplisit_terpisah_dari_auto_generate"
    rationale: "Dibutuhkan untuk deployment non-interaktif (CI, provisioning otomatis); bukan jalur default, hanya aktif bila env var di-set eksplisit."
    status: resolved
  K5:
    question: "Peran tombol Reset Password di launcher GUI pasca-konsolidasi"
    chosen: "redirect_ke_web_setup_login"
    rationale: "Menghindari launcher desktop punya mekanisme auth sendiri terpisah dari sumber kebenaran (admin_account di SQLite) - ini akar masalah Temuan C yang sedang ditutup."
    status: resolved

# ---------------------------------------------------------------------------
# PETA SESI — diturunkan langsung dari kelompok.md. parallel_ok menandai
# apakah task-task dalam sesi itu boleh dikerjakan/disisipi task lain di sesi
# yang sama, atau wajib jadi satu sesi dedicated tanpa gangguan.
# ---------------------------------------------------------------------------
sessions:
  - session: 1
    label: "Infrastruktur admin_account"
    parallel_ok: true
    risk: none
    rationale: >
      Tidak ada locked file, tidak ada logika berisiko. Tabel, repo, unit
      test, daftar ke container — murni infrastruktur. Boleh dikerjakan
      tidak berurutan antar sub-task selama depends_on terpenuhi.
    patchlog_group: "1 entry gabungan untuk T-B1..T-B4 (infrastruktur, belum dipakai auth flow)"
    tasks: [T-B1, T-B2.1, T-B2.2, T-B3.1, T-B3.2, T-B4]

  - session: 2
    label: "Handler setup_admin"
    parallel_ok: false
    risk: medium-high
    rationale: >
      DEDICATED. Kode security-sensitive pertama di Fitur B: validasi input,
      hashing password, race condition submit ganda, rate limit. Meski
      dipecah jadi 6 sub-task, keenamnya menyentuh file yang sama
      (server/handlers/setup.py) dan saling bergantung erat — jangan
      diselingi task lain di sesi ini.
    patchlog_group: "1 entry gabungan untuk T-B5.1..T-B5.6"
    tasks: [T-B5.1, T-B5.2, T-B5.3, T-B5.4, T-B5.5, T-B5.6]

  - session: 3
    label: "Dokumentasi K3 + fallback kegagalan"
    parallel_ok: true
    risk: low
    rationale: >
      Ringan: catatan dokumentasi (K3, tanpa migrasi otomatis) + fallback
      kegagalan setup. Edge-case dari T-B5, bukan logika baru yang berat.
    patchlog_group: "1 entry gabungan untuk T-B6..T-B7 (handler setup_admin, belum reachable dari client)"
    tasks: [T-B6, T-B7]

  - session: 4
    label: "Gate — routing websocket.py"
    parallel_ok: false
    risk: gate
    rationale: >
      DEDICATED, WAJIB. Locked file websocket.py, izin eksplisit terpisah
      dari gate Fitur A meski file sama. Perubahan kecil tapi harus berhenti
      untuk izin dulu — tidak boleh digabung task lain apapun alasannya.
    tasks: [T-B8]

  - session: 5
    label: "Gate — markup #setup-screen"
    parallel_ok: false
    risk: gate
    rationale: >
      DEDICATED, WAJIB. Locked file index.html, izin eksplisit lagi
      (terpisah dari T-B8 meski satu fitur). Markup #setup-screen (Confirm
      Password + area validasi) cukup besar, bukan task sepele.
    tasks: [T-B9.1, T-B9.2]

  - session: 6
    label: "CSS + wiring JS + validasi client"
    parallel_ok: true
    risk: low-medium
    rationale: >
      File asli eksplisit bilang boleh digabung. CSS, wiring JS, validasi
      client bisa paralel karena beda file/concern, tapi SEMUA harus selesai
      sebelum checkpoint end-to-end di akhir sesi ini.
    patchlog_group: "T-B9 sudah punya entry sendiri (sesi 5); T-B10..T-B12.2 boleh digabung 1 entry"
    checkpoint_after: >
      Test manual end-to-end penuh: folder data kosong -> Initial Setup ->
      submit -> redirect Login -> login berhasil. Titik henti alami sebelum
      masuk ke bagian paling kritis (sesi 7-9).
    tasks: [T-B10, T-B11.1, T-B11.2, T-B12.1, T-B12.2]

  - session: 7
    label: "Cut-over sumber kredensial (auth.py)"
    parallel_ok: false
    risk: high
    rationale: >
      DEDICATED, WAJIB. Titik of no return: ganti sumber kredensial auth
      dari config ke SQLite. Butuh requires_human_confirmation eksplisit
      bahwa Tahap B4 (T-B9.1..T-B12.2) final SEBELUM sub-task pertama jalan.
    tasks: [T-B13.1, T-B13.2]

  - session: 8
    label: "Hapus auto-generate password (config.py)"
    parallel_ok: false
    risk: high
    rationale: >
      DEDICATED. Bergantung langsung ke T-B13 berhasil. Tetap dipisah sesi
      sendiri karena tiap high-risk task idealnya punya entry PATCHLOG +
      sesi sendiri — kalau ada yang salah, lebih gampang dilacak/rollback.
    tasks: [T-B14.1, T-B14.2]

  - session: 9
    label: "Bersih-bersih config_security.py & main.py"
    parallel_ok: false
    risk: high
    rationale: >
      DEDICATED. Ditutup dengan regression penuh gaya 8-phase — paling berat
      secara verifikasi di antara tiga task high-risk, butuh sesi sendiri
      tanpa distraksi task lain.
    patchlog_group: "PATCHLOG TERPISAH untuk masing-masing sesi 7/8/9 (T-B13/T-B14/T-B15) — audit trail granular"
    tasks: [T-B15.1, T-B15.2, T-B15.3]

  - session: 10
    label: "Konsolidasi launcher + review security config"
    parallel_ok: true
    risk: low-medium
    rationale: >
      Beda subsistem (GUI launcher) dari web, tapi keduanya "beres-beres"
      pasca migrasi, bobot sedang-ringan. T-B16.x saling bergantung (satu
      file/alur), T-B17 independen dan boleh paralel.
    tasks: [T-B16.1, T-B16.2, T-B16.3, T-B17]

  - session: 11
    label: "Dokumentasi penutup"
    parallel_ok: true
    risk: none
    rationale: >
      Penutup murni dokumentasi. T-B19 depend langsung ke T-B18 jadi
      tetap berurutan, tapi tidak butuh sesi dedicated.
    tasks: [T-B18, T-B19]

# ringkasan_percepatan (opsional untuk agent/planner):
#   Konservatif: 11 sesi (di atas).
#   Agresif (gabung sesi parallel_ok yang berdekatan: 1,3,6,10,11): ~6-7 sesi.
#   Sesi 2, 4, 5, 7, 8, 9 TIDAK boleh digabung apa pun alasannya (dedicated).

tasks:

  # ---------- ORIENTASI ----------
