      - "ikuti pola migrasi bertahap existing di persistence/__init__.py"
    post_commands: ["python automation/find_owner.py persistence/schema.sql --json"]
    dod: ["DB lama tanpa tabel ini tetap bisa dibuka", "tabel baru otomatis terbuat"]

  - id: T-B2.1
    feature: login_redesign
    session: 1
    parallel_ok: true
