[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytgui"
version = "0.1.0"
description = "YouTube music player for Termux with search, radio, queue, and lyrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp==2026.3.17",
    "aiosqlite==0.22.1",
    "aiohttp==3.14.1",
    "syncedlyrics==1.0.1",
    "structlog==24.4.0",
    "prometheus_client==0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "server*", "engine*", "plugins*", "cache*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["scratch_*.py", "insert_missing.py", "append_script*.py", "cleanup_summary.py", "generate_sp.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: line too long
# E722: bare except
# E731: do not assign a lambda expression
# F401: unused import (some we can't fix automatically or too risky for now, wait I'll not ignore it and let ruff --fix handle it)
# E402: module level import not at top of file (legacy code pattern)
# F841: local variable assigned but never used (mostly in tests/legacy)
# E712: comparison to True/False
# E741: ambiguous variable name
# E701, E702: multiple statements on one line
# I001: isort (import sorting)
ignore = ["E501", "E731", "E402", "E712", "E741", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = [
    "^scratch/",
    "^venv/",
    "^\\.venv/",
    "^tests/"
]

[tool.bandit]
exclude_dirs = ["tests", "scratch", ".venv", "venv"]
# B101: assert
# B104: bind to all interfaces (0.0.0.0)
# B108: hardcoded /tmp path
skips = ["B101", "B104", "B108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["start.py"]
