[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # longline — handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "scratch", "scripts", ".venv", "venv"]

[tool.coverage.run]
source = ["core", "engine", "server", "persistence", "adapters", "services", "plugins"]
omit = [
    "launcher/gui/app.py",
    "launcher/gui/ui_builder.py",
    "start.py",
    "*/scratch/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["scripts"]
