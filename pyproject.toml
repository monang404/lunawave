[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "E722", "E712", "F811", "B018", "F403", "B007", "F841", "B028", "UP038", "B904", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["^scratch/", "^tests/"]

[tool.bandit]
exclude_dirs = ["tests", "scratch", "scripts", ".venv", "venv"]

[tool.coverage.run]
source = ["core", "engine", "server", "persistence", "adapters", "services", "plugins"]
omit = [
    "launcher/gui/app.py",
    "launcher/gui/ui_builder.py",
    "start.py",
    "*/scratch/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["scripts"]
