# task_breakdown.agent.yaml
# Versi machine-readable dari task_breakdown.md, dibuat untuk dikonsumsi AI agent.
# Baca AI_CONTEXT.md sekali di awal sesi sebelum eksekusi apa pun.
#
# STATUS: final — semua keputusan desain (lihat blok `decisions`) sudah ditetapkan
# ke opsi yang paling konsisten dengan sistem existing. Tidak ada lagi task yang
# menunggu input pemilik project untuk urusan desain. Satu-satunya persetujuan
# manusia yang masih diperlukan adalah izin file governance-locked (lihat aturan 2).
#
# ATURAN EKSEKUSI UNTUK AGENT:
# 1. Ikuti `execution_order` di akhir file secara sekuensial. Jangan lompat ke depan
#    meski dependency graph terlihat mengizinkan — urutan itu juga mencerminkan
#    checkpoint validasi (doctor.py) yang harus lulus dulu.
# 2. Jangan eksekusi task dengan `locked: true` tanpa berhenti dan meminta konfirmasi
#    eksplisit dari user PERSIS sebelum task itu, walau task lain dengan file yang sama
#    sudah pernah disetujui sebelumnya — izin tidak berlaku otomatis untuk task lain.
# 3. Task dengan `risk: high` (T-B13/T-B14/T-B15) butuh konfirmasi tambahan bahwa
#    Tahap B4 (T-B9..T-B12) sudah dianggap final oleh pemilik project sebelum jalan.
# 4. Setelah tiap task: jalankan `post_commands`, cek `dod` (definition of done) semua
#    true, lalu prepend entry `docs/PATCHLOG.md` (ID: PATCH-YYYY-MM-DD-NNN) kecuali
#    task punya `patchlog: skip`.
# 5. Field `files` dengan prefix `LOCKED:` = governance-locked, tidak boleh disentuh
#    sebelum syarat di aturan 2 terpenuhi.

meta:
  source_features: ["quick_search_discover", "login_redesign"]
  locked_files_global:
    - server/handlers/websocket.py
    - web/static/index.html
    - engine/playback/controller.py   # tidak relevan ke dua fitur ini, jangan disentuh
    - cache/admin_password.txt        # jangan pernah commit
  conventions:
    patchlog_id_format: "PATCH-YYYY-MM-DD-NNN"
    generated_block_markers: ["<!-- BEGIN:GENERATED -->", "<!-- END:GENERATED -->"]
    generated_block_rule: "jangan edit manual di antara marker, jangan hapus marker"
    ai_agent_flag_required_on: [doctor.py, verify_docs.py, architecture_lint.py, verify_structure.py, verify_security.py, find_owner.py, patchlog.py]
    ai_agent_flag: "--json"

# Semua titik keputusan desain sudah final. Dipilih untuk konsistensi maksimal
# dengan pola, arsitektur, dan prinsip yang sudah dianut sistem saat ini —
# tidak ada kolom skema baru, tidak ada sumber kebenaran ganda, tidak ada
# mekanisme baru yang perlu dipelajari ulang.
decisions:
  K1:
    question: "Cakupan filter Genre di Quick Search"
    chosen: "turunkan_jadi_kategori_solo_band_existing"
    rationale: "Genre asli hanya di level artis (artists->artist_genres), tracks.artist bukan foreign key ke artists.id, join by nama artis tidak reliable. Kategori Solo/Band sudah difilter dengan pola sama di filter-bar Discover."
    status: resolved
  K2:
    question: "Cakupan filter Tahun di Quick Search"
    chosen: "turunkan_jadi_filter_dekade_existing"
    rationale: "Tidak ada kolom tahun rilis per-track di skema; artists.tahun_aktif di level artis, teks bebas. Filter dekade sudah persis ada di Discover filter-bar."
    status: resolved
  K3:
    question: "Strategi migrasi kredensial lama saat cut-over login"
    chosen: "tidak_migrasi_wajib_resetup"
    rationale: "Dua file password (cache/admin_password.txt, instance/admin_password.txt) tidak sinkron di lapangan; migrasi otomatis harus menebak sumber benar, risiko salah pilih lebih besar dari biaya re-setup sekali."
    status: resolved
  K4:
    question: "Nasib env var override LUNAWAVE_ADMIN_PASS / YTGUI_ADMIN_PASS"
    chosen: "dipertahankan_sebagai_override_eksplisit_terpisah_dari_auto_generate"
    rationale: "Dibutuhkan untuk deployment non-interaktif (CI, provisioning otomatis); bukan jalur default, hanya aktif bila env var di-set eksplisit."
    status: resolved
  K5:
    question: "Peran tombol Reset Password di launcher GUI pasca-konsolidasi"
    chosen: "redirect_ke_web_setup_login"
    rationale: "Menghindari launcher desktop punya mekanisme auth sendiri terpisah dari sumber kebenaran (admin_account di SQLite) - ini akar masalah Temuan C yang sedang ditutup."
    status: resolved

